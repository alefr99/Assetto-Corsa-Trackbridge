name: Regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: python tests/prepare_obj_test.py
      - run: python tests/zen_camera_patch_test.py
      - name: Synthetic installer tests
        shell: pwsh
        run: ./tests/install_test.ps1
